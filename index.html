<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1016" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>範文貪食蛇</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section id="screen-home" class="screen active">
      <div class="shell">
        <header class="brand">
          <h1>範文貪食蛇</h1>
          <p>按詩句順序吃字，背默十二篇範文</p>
        </header>
        <div id="home-list" class="card-list"></div>
      </div>
    </section>

    <section id="screen-collection" class="screen">
      <div class="shell">
        <header class="brand">
          <h1 id="collection-title">詩三首</h1>
          <p>選擇篇章開始背默</p>
        </header>
        <div id="collection-list" class="card-list"></div>
        <button id="btn-back-collection" class="link-btn" type="button">
          ← 返回主頁
        </button>
      </div>
    </section>

    <section id="screen-game" class="screen">
      <header class="game-header">
        <div class="game-title-row">
          <h2 id="poem-title">〈山居秋暝〉</h2>
          <span class="app-name">範文貪食蛇</span>
        </div>
        <div class="scoreboard">
          <div class="stat">
            <span class="label">分數</span>
            <span id="stat-score" class="value">100</span>
          </div>
          <div class="stat">
            <span class="label">吃錯</span>
            <span id="stat-mistakes" class="value">0</span>
          </div>
          <div class="stat">
            <span class="label">聯</span>
            <span id="stat-couplet" class="value">1/4</span>
          </div>
        </div>
        <div id="progress" class="progress" data-idle="1"></div>
      </header>

      <div id="board-wrap" class="board-wrap">
        <div id="board" class="board" aria-label="遊戲網格"></div>
      </div>

      <div class="controls">
        <div class="difficulty">
          <span class="label">難度</span>
          <div class="seg" role="group" aria-label="難度">
            <button type="button" data-speed="slow">慢</button>
            <button type="button" data-speed="mid" class="active">中</button>
            <button type="button" data-speed="fast">快</button>
          </div>
        </div>
        <div class="actions">
          <button id="btn-start" class="btn btn-primary" type="button">
            開始遊戲
          </button>
          <button id="btn-back-game" class="btn btn-ghost" type="button">
            返回
          </button>
        </div>
        <p class="hint">電腦：方向鍵或 WASD　手機：在網格上滑動</p>
      </div>
    </section>

    <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal">
        <h3 id="overlay-title">遊戲結束</h3>
        <p id="overlay-score" class="final-score">得分 100</p>
        <p id="overlay-detail">吃錯 0 次</p>
        <div class="actions">
          <button id="btn-overlay-restart" class="btn btn-primary" type="button">
            重新開始
          </button>
          <button id="btn-overlay-home" class="btn btn-ghost" type="button">
            返回主頁
          </button>
        </div>
      </div>
    </div>

    <script src="js/poems.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
